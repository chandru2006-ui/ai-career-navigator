<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Roadmap — AI Career Navigator</title>
<link rel="stylesheet" href="/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="page-layout">
  <div id="sidebar-placeholder"></div>

  <div class="main-content">
    <header class="page-header">
      <button class="hamburger" id="hamburger">☰</button>
      <div>
        <div class="page-title">My Learning Roadmap</div>
        <div class="page-subtitle" id="roadmap-subtitle">AI-personalized learning path</div>
      </div>
      <div style="display:flex;gap:.75rem">
        <button class="btn btn-outline btn-sm" id="recalc-btn" onclick="recalculateRoadmap()" style="display:none">🔄 Recalculate</button>
        <button class="btn btn-primary btn-sm" id="generate-btn" onclick="generateRoadmap()">✨ Generate Roadmap</button>
      </div>
    </header>

    <main class="page-body" id="roadmap-content">
      <div style="text-align:center;padding:4rem">
        <div class="loading-spinner" style="width:36px;height:36px;border-width:3px;margin:0 auto 1rem"></div>
        <p class="text-muted">Loading roadmap...</p>
      </div>
    </main>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
if (!requireAuth()) throw new Error('not auth');
injectSidebar('roadmap');

// ── Read URL context ──────────────────────────────────────────
const params = new URLSearchParams(location.search);
const urlJourneyId = params.get('journeyId') || null;
const urlCareerId  = params.get('careerId')  || null;

let currentRoadmap = null;
let contextJourneyId = urlJourneyId;   // the journey we are viewing
let contextCareerId  = urlCareerId;    // fallback

function statusIcon(s) {
  return {completed:'✅','in-progress':'🔄','not-started':'⭕'}[s]||'⭕';
}
function statusLabel(s) {
  return {'not-started':'Not Started','in-progress':'In Progress','completed':'Completed'}[s]||s;
}
function statusBadge(s) {
  const c={'completed':'badge-green','in-progress':'badge-blue','not-started':'badge-gray'};
  return `<span class="badge ${c[s]||'badge-gray'}">${statusLabel(s)}</span>`;
}

// ── Show journey context banner if viewing a specific journey ─
function renderContextBanner(roadmap) {
  if (!urlJourneyId) return '';
  return `
    <div style="background:rgba(79,70,229,.08);border:1px solid rgba(79,70,229,.25);border-radius:var(--radius-sm);
      padding:.75rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div style="font-size:.875rem;color:var(--primary-light)">
        📋 Viewing roadmap for: <strong>${roadmap?.careerId?.title || 'Career Journey'}</strong>
      </div>
      <a href="/history.html" class="btn btn-ghost btn-sm">← Back to History</a>
    </div>
  `;
}

function renderRoadmap(roadmap) {
  currentRoadmap = roadmap;
  // Extract careerId from roadmap for generate/recalculate
  contextCareerId = roadmap.careerId?._id || roadmap.careerId || contextCareerId;

  document.getElementById('roadmap-subtitle').textContent =
    `${roadmap.careerId?.title || 'Career'} · Version ${roadmap.version} · Generated by ${roadmap.generatedBy}`;
  document.getElementById('recalc-btn').style.display = 'inline-flex';
  document.getElementById('generate-btn').textContent = '✨ Regenerate';

  const phases = roadmap.phases || [];
  const completed = phases.filter(p=>p.status==='completed').length;

  document.getElementById('roadmap-content').innerHTML = `
    ${renderContextBanner(roadmap)}

    <!-- Overall progress -->
    <div class="card" style="margin-bottom:1.5rem">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1rem">
        <div>
          <div style="font-size:1.1rem;font-weight:700">Overall Progress</div>
          <div class="text-muted text-sm">${completed} of ${phases.length} phases completed</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:2rem;font-weight:900;color:var(--primary-light)">${roadmap.overallProgress}%</div>
          <div class="text-muted text-xs">complete</div>
        </div>
      </div>
      <div class="progress-bar-wrap" style="height:12px">
        <div class="progress-bar-fill green" style="width:${roadmap.overallProgress}%"></div>
      </div>
      ${roadmap.aiSummary ? `
        <div style="margin-top:1rem;padding:.875rem;background:rgba(79,70,229,.08);border-radius:var(--radius-sm);border:1px solid rgba(79,70,229,.2);font-size:.875rem;color:var(--text-muted);line-height:1.6">
          🤖 <em>${roadmap.aiSummary}</em>
        </div>
      ` : ''}
    </div>

    <!-- Phases -->
    <div id="phases-container">
      ${phases.map((phase, i) => renderPhase(phase, i, roadmap._id)).join('')}
    </div>

    <!-- Bottom CTA -->
    <div style="display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap">
      <a href="/mentor.html${contextJourneyId ? '?journeyId='+contextJourneyId : ''}" class="btn btn-primary">🤖 Ask AI Mentor</a>
      <a href="/assessment.html${contextJourneyId ? '?journeyId='+contextJourneyId : ''}" class="btn btn-outline">📝 Reassess Skills</a>
      ${urlJourneyId ? '<a href="/history.html" class="btn btn-ghost">← Career History</a>' : ''}
    </div>
  `;
}

function renderPhase(phase, i, roadmapId) {
  const topics    = phase.topics || [];
  const exercises = phase.practicalExercises || [];
  const resources = phase.resources || [];

  return `
    <div class="roadmap-phase" id="phase-${i}">
      <div class="phase-dot ${phase.status}">
        ${phase.status === 'completed' ? '✓' : phase.status === 'in-progress' ? '▶' : i+1}
      </div>
      <div class="phase-card ${phase.status === 'in-progress' ? 'active' : phase.status === 'completed' ? 'completed-phase' : ''}">
        <div class="phase-header">
          <div>
            <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.2rem">Phase ${phase.phaseNumber || i+1}</div>
            <div class="phase-title">${phase.title}</div>
          </div>
          <div class="phase-meta">
            <span class="badge badge-gray">⏱ ${phase.duration}</span>
            ${statusBadge(phase.status)}
          </div>
        </div>

        <div style="margin-bottom:.75rem">
          <div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted);margin-bottom:.3rem">
            <span>Phase Progress</span><span>${phase.progressPercentage}%</span>
          </div>
          <div class="progress-bar-wrap" style="height:5px">
            <div class="progress-bar-fill ${phase.status==='completed'?'green':''}" style="width:${phase.progressPercentage}%"></div>
          </div>
        </div>

        ${phase.reason ? `<p style="font-size:.8rem;color:var(--text-muted);font-style:italic;margin-bottom:.75rem">📌 ${phase.reason}</p>` : ''}

        ${topics.length ? `
          <div style="margin-bottom:.75rem">
            <div style="font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem">Topics to cover:</div>
            <div class="phase-topics">
              ${topics.map(t=>`<span class="topic-chip">📖 ${t}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        ${exercises.length ? `
          <div style="margin-bottom:.75rem">
            <div style="font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem">Practical exercises:</div>
            <div style="display:flex;flex-direction:column;gap:.3rem">
              ${exercises.map(ex=>`<div style="font-size:.8rem;color:var(--text-muted)">🛠 ${ex}</div>`).join('')}
            </div>
          </div>
        ` : ''}

        ${resources.length ? `
          <div style="margin-bottom:.75rem">
            <div style="font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:.4rem">Resources:</div>
            <div style="display:flex;flex-wrap:wrap;gap:.4rem">
              ${resources.map(r=>`<span class="topic-chip">🔗 ${r}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        <div class="phase-actions">
          ${phase.status !== 'completed' ? `
            <div style="display:flex;align-items:center;gap:.5rem;flex:1">
              <input type="range" min="0" max="100" value="${phase.progressPercentage}"
                style="flex:1;accent-color:var(--primary)"
                oninput="document.getElementById('prog-val-${i}').textContent=this.value+'%'"
                onchange="updatePhaseProgress('${roadmapId}', ${i}, this.value)"
                id="prog-slider-${i}">
              <span id="prog-val-${i}" style="font-size:.8rem;font-weight:700;min-width:36px">${phase.progressPercentage}%</span>
            </div>
          ` : `<span style="color:var(--success);font-size:.875rem;font-weight:600">✅ Completed!</span>`}
          <button class="btn btn-sm ${phase.status==='not-started'?'btn-primary':'btn-secondary'}"
            onclick="markPhase('${roadmapId}', ${i}, '${phase.status}')">
            ${phase.status === 'not-started' ? 'Start Phase' :
              phase.status === 'in-progress' ? '✅ Mark Complete' : '↩ Reset'}
          </button>
          <a href="/mentor.html?q=${encodeURIComponent('Help me with '+phase.title)}${contextJourneyId?'&journeyId='+contextJourneyId:''}"
             class="btn btn-ghost btn-sm">🤖 Ask AI</a>
        </div>
      </div>
    </div>
  `;
}

async function updatePhaseProgress(roadmapId, phaseIndex, value) {
  try {
    const res = await api.updateProgress({ roadmapId, phaseIndex, progressPercentage: parseInt(value) });
    currentRoadmap = res.roadmap;
    renderRoadmap(res.roadmap);
  } catch (err) {
    showToast('Failed to update progress: ' + err.message, 'error');
  }
}

async function markPhase(roadmapId, phaseIndex, currentStatus) {
  const nextStatus = currentStatus === 'not-started' ? 'in-progress' :
                     currentStatus === 'in-progress'  ? 'completed'   : 'not-started';
  const pct = nextStatus === 'completed' ? 100 : nextStatus === 'not-started' ? 0 : 50;
  try {
    const res = await api.updateProgress({ roadmapId, phaseIndex, status: nextStatus, progressPercentage: pct });
    renderRoadmap(res.roadmap);
    showToast(`Phase marked as ${statusLabel(nextStatus)}`, 'success');
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  }
}

async function generateRoadmap() {
  const btn = document.getElementById('generate-btn');
  setLoading(btn, true, 'Generating...');
  document.getElementById('roadmap-content').innerHTML = `
    <div style="text-align:center;padding:4rem">
      <div class="loading-spinner" style="width:48px;height:48px;border-width:3px;margin:0 auto 1.5rem"></div>
      <h3 style="margin-bottom:.5rem">Generating Your AI Roadmap</h3>
      <p class="text-muted">Analyzing your skill gaps and crafting a personalized plan...</p>
    </div>
  `;
  try {
    // Pass both careerId and journeyId so the correct assessment result is used
    const res = await api.generateRoadmap(contextCareerId, contextJourneyId);
    contextJourneyId = contextJourneyId || res.roadmap.journeyId;
    renderRoadmap(res.roadmap);
    showToast(
      res.aiAvailable ? '✨ AI roadmap generated!' : 'System roadmap generated (configure AI for personalized plan)',
      res.aiAvailable ? 'success' : 'warning'
    );
  } catch (err) {
    document.getElementById('roadmap-content').innerHTML = `
      <div class="alert alert-error" style="margin-bottom:1rem">${err.message}</div>
      <div class="empty-state">
        <p>Make sure you've completed an assessment first.</p>
        <a href="/assessment.html" class="btn btn-primary">Take Assessment</a>
      </div>
    `;
  } finally {
    setLoading(btn, false);
  }
}

async function recalculateRoadmap() {
  const btn = document.getElementById('recalc-btn');
  setLoading(btn, true, 'Recalculating...');
  try {
    const res = await api.recalculateRoadmap(contextCareerId, contextJourneyId);
    renderRoadmap(res.roadmap);
    showToast('Roadmap updated based on latest assessment!', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    setLoading(btn, false);
  }
}

async function loadRoadmap() {
  try {
    // CRITICAL: pass journeyId if available, so the correct roadmap loads
    const res = await api.getRoadmap(contextCareerId, contextJourneyId);
    if (res.roadmap) {
      renderRoadmap(res.roadmap);
    } else {
      const backLink = urlJourneyId
        ? `<a href="/history.html" class="btn btn-ghost">← Back to History</a>` : '';
      document.getElementById('roadmap-content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🗺️</div>
          <h3>No Roadmap Yet</h3>
          <p>Complete an assessment, then generate your personalized AI learning roadmap.</p>
          <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
            <a href="/assessment.html" class="btn btn-outline">📝 Take Assessment</a>
            <button class="btn btn-primary" onclick="generateRoadmap()">✨ Generate Roadmap</button>
            ${backLink}
          </div>
        </div>
      `;
    }
  } catch (err) {
    document.getElementById('roadmap-content').innerHTML = `
      <div class="alert alert-error">Failed to load roadmap: ${err.message}</div>
    `;
  }
}

loadRoadmap();
</script>
</body>
</html>
